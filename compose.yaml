services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: activity_platform
      MYSQL_USER: activity_user
      MYSQL_PASSWORD: activity_local_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - activity_db:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  activity_db:
