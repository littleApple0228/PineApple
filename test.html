<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>廢墟版活動報名平台</title>
    <!-- 引入 Bootstrap 5 以快速排版 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .page-section { display: none; }
        .active-section { display: block; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#" onclick="showPage('activity-list')">活動報名平台</a>
        <div class="navbar-nav">
            <a class="nav-link" href="#" onclick="showPage('activity-list')">活動清單</a>
            <a class="nav-link" href="#" onclick="showPage('add-activity')">新增活動</a>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 1. 活動清單頁 -->
    <div id="activity-list" class="page-section active-section">
        <h3>可報名的活動清單</h3>
        <table class="table table-hover mt-3">
            <thead class="table-light">
                <tr>
                    <th>活動編號</th>
                    <th>活動名稱</th>
                    <th>活動時間</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="activity-table-body">
                <!-- 這裡將由 JS 動態填入從後端 API 取得的活動資料 -->
                <tr>
                    <td>1</td>
                    <td>測試活動 A</td>
                    <td>2026-11-01 14:00</td>
                    <td>
                        <button class="btn btn-primary btn-sm" onclick="goToRegister(1, '測試活動 A')">點擊報名</button>
                        <button class="btn btn-outline-secondary btn-sm" onclick="viewRegistrations(1, '測試活動 A')">查看報名清單</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 2. 新增活動頁 -->
    <div id="add-activity" class="page-section">
        <h3>新增新的活動</h3>
        <form id="addActivityForm" onsubmit="submitActivity(event)" class="mt-3">
            <div class="mb-3">
                <label class="form-label">活動名稱</label>
                <input type="text" class="form-control" id="activity_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">活動說明</label>
                <textarea class="form-control" id="activity_description" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">活動時間</label>
                <input type="datetime-local" class="form-control" id="activity_time" required>
            </div>
            <button type="submit" class="btn btn-success">建立活動</button>
        </form>
    </div>

    <!-- 3. 報名表單頁 -->
    <div id="registration-form" class="page-section">
        <h3>填寫報名表</h3>
        <h5 class="text-primary mb-3">報名活動：<span id="target-activity-name"></span></h5>
        <form id="registerForm" onsubmit="submitRegistration(event)">
            <input type="hidden" id="reg_activity_id">
            <div class="mb-3">
                <label class="form-label">姓名</label>
                <input type="text" class="form-control" id="reg_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">聯絡電話</label>
                <input type="tel" class="form-control" id="reg_phone" pattern="[0-9]*" placeholder="例如: 0912345678" required>
                <div class="form-text">將以文字格式保存，保留開頭的 0。</div>
            </div>
            <button type="submit" class="btn btn-primary">送出完成報名</button>
        </form>
    </div>

    <!-- 4. 指定活動的報名清單頁 -->
    <div id="registration-list" class="page-section">
        <h3>查看活動報名清單</h3>
        <h5 class="text-primary mb-3">活動：<span id="list-activity-name"></span></h5>
        <button class="btn btn-secondary btn-sm mb-3" onclick="showPage('activity-list')">返回活動清單</button>
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>報名編號</th>
                    <th>姓名</th>
                    <th>聯絡電話</th>
                    <th>報名時間</th>
                </tr>
            </thead>
            <tbody id="registration-table-body">
                <!-- 由後端 API 取得該活動的報名者名單 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 設定後端 API 的基礎網址
    const API_BASE = 'http://127.0.0.1:8000/api';

    // 頁面載入時，自動去後端抓取活動清單
    window.onload = function() {
        fetchActivities();
    };

    // 切換頁面顯示
    function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active-section'));
        document.getElementById(pageId).classList.add('active-section');
        
        // 如果切換回活動清單，重新整理資料
        if (pageId === 'activity-list') {
            fetchActivities();
        }
    }

    // 1. 從後端取得並顯示【活動清單】
    async function fetchActivities() {
        try {
            const response = await fetch(`${API_BASE}/activities`);
            const activities = await response.json();
            
            const tbody = document.getElementById('activity-table-body');
            tbody.innerHTML = ''; // 清空原本內容
            
            activities.forEach(act => {
                // 將時間格式稍微美化，把中間的 'T' 換成空白
                const timeStr = act.activity_time.replace('T', ' ');
                tbody.innerHTML += `
                    <tr>
                        <td>${act.activity_id}</td>
                        <td>${act.activity_name}</td>
                        <td>${timeStr}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="goToRegister(${act.activity_id}, '${act.activity_name}')">點擊報名</button>
                            <button class="btn btn-outline-secondary btn-sm" onclick="viewRegistrations(${act.activity_id}, '${act.activity_name}')">查看報名清單</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error("無法取得活動清單:", error);
            alert("無法連線到伺服器，請確認 FastAPI 是否有啟動。");
        }
    }

    // 2. 處理【新增活動】送出
    async function submitActivity(event) {
        event.preventDefault();
        
        // 收集表單資料
        const data = {
            activity_name: document.getElementById('activity_name').value,
            activity_description: document.getElementById('activity_description').value,
            activity_time: document.getElementById('activity_time').value
        };
        
        try {
            const response = await fetch(`${API_BASE}/activities`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                alert('活動新增成功！');
                document.getElementById('addActivityForm').reset();
                showPage('activity-list');
            } else {
                alert('新增失敗，請檢查資料。');
            }
        } catch (error) {
            console.error("新增活動錯誤:", error);
        }
    }

    // 準備跳轉至報名表單
    function goToRegister(activityId, activityName) {
        document.getElementById('reg_activity_id').value = activityId;
        document.getElementById('target-activity-name').textContent = activityName;
        document.getElementById('registerForm').reset();
        showPage('registration-form');
    }

    // 3. 處理【報名表單】送出
    async function submitRegistration(event) {
        event.preventDefault();
        
        const data = {
            activity_id: parseInt(document.getElementById('reg_activity_id').value),
            name: document.getElementById('reg_name').value,
            phone: document.getElementById('reg_phone').value
        };
        
        try {
            const response = await fetch(`${API_BASE}/registrations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                alert('報名成功！');
                showPage('activity-list');
            } else {
                alert('報名失敗，請檢查資料。');
            }
        } catch (error) {
            console.error("報名錯誤:", error);
        }
    }

    // 4. 查看特定活動的【報名清單】
    async function viewRegistrations(activityId, activityName) {
        document.getElementById('list-activity-name').textContent = activityName;
        
        try {
            // 透過網址參數 ?activity_id=X 查詢
            const response = await fetch(`${API_BASE}/registrations?activity_id=${activityId}`);
            const registrations = await response.json();
            
            const tbody = document.getElementById('registration-table-body');
            tbody.innerHTML = '';
            
            if (registrations.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center">目前還沒有人報名喔！</td></tr>';
            } else {
                registrations.forEach(reg => {
                    const timeStr = reg.registration_time.replace('T', ' ').substring(0, 19);
                    tbody.innerHTML += `
                        <tr>
                            <td>${reg.registration_id}</td>
                            <td>${reg.name}</td>
                            <td>${reg.phone}</td>
                            <td>${timeStr}</td>
                        </tr>
                    `;
                });
            }
            showPage('registration-list');
        } catch (error) {
            console.error("無法取得報名清單:", error);
        }
    }
</script>

</body>
</html>
